name: Build Cry of Fear Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          sdkmanager --version

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses

          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "ndk;29.0.14206865"

      - name: Make Waf and Gradle executable
        run: |
          chmod +x src/cof/waf
          chmod +x external/xash3d-fwgs/android/gradlew

      - name: Build Cry of Fear Android APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== STARTING BUILD ====="

          $abis = [string[]]@("arm64")

          ./scripts/build-android.ps1 `
            -Configuration "Release" `
            -Abi $abis `
            -MinSdk 23 `
            -NdkVersion "29.0.14206865" `
            -Jobs 2

          Write-Host "===== BUILD SCRIPT FINISHED ====="

      - name: Find generated APK
        shell: bash
        run: |
          echo "===== SEARCHING FOR APK FILES ====="

          APK_FILES=$(find . -type f -name "*.apk" -print)

          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No APK file was generated."
            echo ""
            echo "===== BUILD DIRECTORY ====="

            if [ -d "build" ]; then
              find build -type f -print
            else
              echo "No build directory exists."
            fi

            echo ""
            echo "===== ANDROID PROJECT DIRECTORY ====="

            if [ -d "build/android" ]; then
              find build/android -type f -print
            fi

            exit 1
          fi

          echo "APK file(s) found:"
          echo "$APK_FILES"

      - name: Prepare APK for upload
        shell: bash
        run: |
          mkdir -p out/android

          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)

          echo "Using APK:"
          echo "$APK_PATH"

          cp "$APK_PATH" "out/android/xash3d-cof.apk"

          echo "Final APK:"
          ls -lh "out/android/xash3d-cof.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cry-of-fear-android-arm64
          path: out/android/xash3d-cof.apk
          if-no-files-found: error              Write-Host "APK FOUND: $($_.FullName)"
            }

          Write-Host "===== SEARCHING BUILD DIRECTORIES ====="

          if (Test-Path "build") {
            Get-ChildItem "build" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
          }

          Write-Host "===== END ====="

      - name: Find generated APK
        shell: bash
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cry-of-fear-android-arm64
          path: |
            **/*.apk
          if-no-files-found: error
