name: Build Cry of Fear Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/tools/bin" >> $GITHUB_PATH

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          sdkmanager --version

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "ndk;29.0.14206865"

      - name: Make Waf and Gradle executable
        run: |
          chmod +x src/cof/waf
          chmod +x external/xash3d-fwgs/android/gradlew

      - name: Build Cry of Fear Android APK
        shell: pwsh
        run: |
          ./scripts/build-android.ps1 `
            -Configuration Release `
            -Abi arm64 `
            -MinSdk 23 `
            -NdkVersion 29.0.14206865 `
            -Jobs 2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cry-of-fear-android-arm64
          path: out/android/xash3d-cof.apk
          if-no-files-found: error
